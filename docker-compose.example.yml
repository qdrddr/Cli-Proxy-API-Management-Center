# Example: CLIProxyAPI backend + this Management Center UI (same-origin via reverse proxy).
#
# 1. Copy your CLIProxyAPI config.yaml and set:
#      remote-management:
#        disable-control-panel: true
#    so the backend does not download its own management.html.
# 2. docker compose -f docker-compose.example.yml up -d
# 3. Open http://localhost:8080/management.html and sign in with your management key.
#    API base URL defaults to this host (http://localhost:8080); nginx proxies /v8 and /v0 to the API.

services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    pull_policy: always
    container_name: cli-proxy-api
    ports:
      - '8317:8317'
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGINS_PATH:-./plugins}:/CLIProxyAPI/plugins
    restart: unless-stopped

  management-center:
    image: ${MANAGEMENT_IMAGE:-bbkudk/cli-proxy-management-center:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${MANAGEMENT_VERSION:-dev}
    container_name: cli-proxy-management-center
    depends_on:
      - cli-proxy-api
    environment:
      NGINX_PORT: '8080'
      CLIPROXY_API_BACKEND: http://cli-proxy-api:8317
    ports:
      - '${MANAGEMENT_PORT:-8080}:8080'
    restart: unless-stopped
