# CLIProxyAPI + Management Center UI (same-origin via reverse proxy).
#
# Run from this directory:
#   docker compose up -d
#
# 1. Config default: ./cli-proxy-api.config.example.yaml (must be a FILE). It must include
#    oauth.auth-dir so the API nono entrypoint stages credentials under /CLIProxyAPI/.staging/auths.
#    If you bind ./config.yaml before the file exists, Docker creates a directory and the API crash-loops.
#    Fix: docker compose down && rm -rf config.yaml
#      cp cli-proxy-api.config.example.yaml config.yaml  # edit secret-key
#      export CLI_PROXY_CONFIG_PATH=./config.yaml
# 2. Open http://localhost:8081/management.html (8080 is often taken by a local nginx).
#    Sign in with your management key. API base URL defaults to this host; nginx proxies /v8 and /v0.
# 3. Only management-center runs under nono (bbkudk/cli-proxy-api is unsandboxed). Override profile:
#      export NONO_PROFILE_PATH=./nono/profiles/management.json
# 4. Optional env: TZ (default UTC), NGINX_PORT, CLIPROXY_API_BACKEND, NONO_VERSION, MANAGEMENT_PORT.

services:
  cli-proxy-api:
    image: bbkudk/cli-proxy-api:latest
    pull_policy: always
    container_name: cli-proxy-api
    ports:
      - '8317:8317'
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./cli-proxy-api.config.example.yaml}:/CLIProxyAPI/config.yaml:ro
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGINS_PATH:-./plugins}:/CLIProxyAPI/plugins
    healthcheck:
      test: ['CMD', 'bash', '-c', 'echo > /dev/tcp/127.0.0.1/8317']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  management-center:
    image: ${MANAGEMENT_IMAGE:-bbkudk/cli-proxy-management-center:v1.26.7}
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      args:
        VERSION: ${MANAGEMENT_VERSION:-v1.26.7}
        NONO_VERSION: ${NONO_VERSION:-0.80.0}
    container_name: cli-proxy-management-center
    depends_on:
      cli-proxy-api:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      NGINX_PORT: ${NGINX_PORT:-8080}
      CLIPROXY_API_BACKEND: ${CLIPROXY_API_BACKEND:-http://cli-proxy-api:8317}
      NONO_PROFILE: ${NONO_PROFILE:-management}
      NONO_RUN_ARGS: ${NONO_RUN_ARGS:-}
    volumes:
      - ${NONO_PROFILE_PATH:-./nono/profiles/management.json}:/root/.config/nono/profiles/management.json:ro
    ports:
      - '${MANAGEMENT_PORT:-8081}:8080'
    restart: unless-stopped
